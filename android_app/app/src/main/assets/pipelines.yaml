# Configuration for available inference pipelines.
# pipeline.onnx is not versioned: generate it with scripts/export_onnx.py (see android_app/README.md).
# More entries can be added to compare models exported with different parameters.
pipelines:
  - name: default
    model: pipeline/pipeline.onnx
    embeddings: pipeline/places_db.bin
    label_map: pipeline/label_map.json
    description: Final model, Cáceres dataset.
